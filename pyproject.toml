[project]
name = "eve-diagnostics-booking"
version = "0.1.0"
description = "Backend service for diagnostic test bookings and simulated payments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt[crypto]>=2.8",
    "passlib[bcrypt]>=1.7.7",
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "celery>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Make the project importable regardless of how pytest is invoked. Without this,
# `pytest` (the console script) cannot import `app`, while `python -m pytest`
# happens to work only because it prepends the working directory.
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Alembic writes single-line DDL by design; reformatting it hurts review diffs.
"alembic/versions/*" = ["E501"]
"alembic/script.py.mako" = ["E501", "I001"]
